# SerpentX — production run. Point your miners at this host's port 3333 and open
# the dashboard on :8080. Configure EITHER by dropping a config.json in ./config/
# OR by filling in .env (copy .env.example -> .env). GPLv3.
name: serpentx

services:
  serpentx:
    build: .
    image: serpentx
    container_name: serpentx
    restart: unless-stopped
    ports:
      - "3333:3333"    # miners point here (stratum+tcp://<host>:3333)
      - "8080:8080"    # web dashboard  (http://<host>:8080)
    volumes:
      - ./config:/config
    env_file:
      - .env
